<div class="chat-page">
  <h1>TaskEd Assistant</h1>
  <p class="subtitle">Ask about how TaskEd works, or about your own tickets.</p>

  <div class="message-list">
    @for (m of messages; track $index) {
      <div class="message" [class.from-user]="m.role === 'user'">
        <div class="bubble">{{ m.content }}</div>
      </div>
    }
    @if (sending) {
      <div class="message">
        <div class="bubble typing">
          <app-loading [compact]="true" />
        </div>
      </div>
    }
    <div #scrollAnchor></div>
  </div>

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <form class="composer" [formGroup]="form" (ngSubmit)="send()">
    <input formControlName="message" placeholder="Type a message…" autocomplete="off" />
    <button type="submit" [disabled]="form.invalid || sending">Send</button>
  </form>
</div>
