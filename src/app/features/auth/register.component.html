<div class="register-page">
  <form class="register-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Complete your TaskEd profile</h1>
    <p class="subtitle">Signed in as {{ auth.currentUser()?.depedEmail }}</p>

    <label>
      I am a&hellip;
      <select formControlName="role">
        <option [value]="Role.TEACHER">Teacher</option>
        <option [value]="Role.ADMIN_OFFICER">Administrative Officer</option>
        <option [value]="Role.ADMIN_OFFICE_ACCOUNT">Administrative Office (public-post) account</option>
        <option [value]="Role.ADMINISTRATOR">Administrator</option>
      </select>
    </label>

    <label>
      Designation
      <input formControlName="designation" placeholder="e.g. Teacher I, Administrative Officer II" />
    </label>

    <label>
      District
      <input formControlName="district" placeholder="e.g. Santa Fe District" />
    </label>

    @if (isTeacher) {
      <label>
        School
        <select formControlName="schoolId">
          <option value="" disabled>Select your school</option>
          @for (school of schools; track school.id) {
            <option [value]="school.id">{{ school.name }} ({{ school.district }})</option>
          }
        </select>
      </label>
    }

    @if (isAo) {
      <fieldset>
        <legend>Schools you'll process tickets for</legend>
        @for (school of schools; track school.id) {
          <label class="checkbox-row">
            <input
              type="checkbox"
              (change)="toggleAssignedSchool(school.id, $any($event.target).checked)"
            />
            {{ school.name }} ({{ school.district }})
          </label>
        }
      </fieldset>
    }

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button type="submit" [disabled]="form.invalid || submitting">
      {{ submitting ? 'Submitting…' : 'Submit for approval' }}
    </button>
  </form>
</div>
