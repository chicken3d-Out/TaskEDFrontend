<div class="profile-page">
  <form class="profile-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Your profile</h1>
    <p class="subtitle">{{ auth.currentUser()?.depedEmail }} · {{ auth.currentUser()?.role }}</p>

    <label>
      Name
      <input formControlName="name" />
    </label>

    <label>
      Designation
      <input formControlName="designation" />
    </label>

    <label>
      District
      <input formControlName="district" />
    </label>

    @if (isTeacher) {
      <label>
        School
        <select formControlName="schoolId">
          @for (school of schools; track school.id) {
            <option [value]="school.id">{{ school.name }} ({{ school.district }})</option>
          }
        </select>
      </label>
    }

    @if (error) {
      <p class="error">{{ error }}</p>
    }
    @if (saved) {
      <p class="success">Saved.</p>
    }

    <button type="submit" [disabled]="form.invalid || saving">
      {{ saving ? 'Saving…' : 'Save changes' }}
    </button>
  </form>
</div>
